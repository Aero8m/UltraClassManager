{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2><i class="fa-solid fa-user-plus"></i> 注册</h2>
    <form method="POST">
        <div class="form-group">
            <label><i class="fa-solid fa-user"></i> 用户名</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-lock"></i> 密码</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">注册</button>
    </form>
    <p style="margin-top: 16px; color: #888;">已有账号？<a href="{{ url_for('auth.login') }}" style="color: #1565c0;">去登录</a></p>
</div>
{% endblock %}
